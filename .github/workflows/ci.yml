name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: Grant execute permission for mvnw
        run: chmod +x apps/api/mvnw
      - name: Run tests
        working-directory: apps/api
        # `verify` runs unit + integration tests against the `test` profile (H2).
        run: ./mvnw clean verify -B

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: Install deps
        working-directory: apps/web
        run: npm ci || npm install
      - name: Type-check
        working-directory: apps/web
        run: npm run typecheck
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Unit tests
        working-directory: apps/web
        # Vitest with --passWithNoTests; will become enforced once frontend tests land.
        run: npm test
      - name: Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build

  # The Docker / E2E pipelines depend on infra/docker/* which is not yet checked
  # in. They will be re-enabled once those stacks land. Leaving them out of CI
  # rather than letting them fail (or worse, masking failures with `|| true`).

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Only run on PRs/pushes that touch the web or api app code, to avoid
    # spending CI time on docs-only changes.
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    services:
      mysql:
        image: mysql:8.0
        ports: ['3306:3306']
        env:
          MYSQL_DATABASE: darlemlih
          MYSQL_USER: dar
          MYSQL_PASSWORD: lemlih
          MYSQL_ROOT_PASSWORD: rootpw
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -prootpw"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Required env vars present
        run: |
          # Fail fast if the runner forgot to wire the secrets we need at runtime.
          test -n "${JWT_SECRET}" || (echo "::error::JWT_SECRET secret is missing" && exit 1)
        env:
          # JWT_SECRET defaults to a generated value for E2E only; in production
          # this must come from a real secret store.
          JWT_SECRET: e2e-test-secret-must-be-at-least-32-characters-long-okok

      - name: Build & start API (background)
        working-directory: apps/api
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_URL: jdbc:mysql://localhost:3306/darlemlih?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USERNAME: dar
          DB_PASSWORD: lemlih
          JWT_SECRET: e2e-test-secret-must-be-at-least-32-characters-long-okok
          JWT_ACCESS_TOKEN_EXPIRATION: 900000
          JWT_REFRESH_TOKEN_EXPIRATION: 604800000
          PAYMENT_PROVIDER: mock
          WEB_BASE_URL: http://localhost:3000
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests package
          java -jar target/*.jar &
          # Wait until /actuator/health is healthy.
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/actuator/health && break || sleep 2
          done

      - name: Build & start web (background)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npm run start -- --port 3000 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/fr && break || sleep 2
          done

      - name: Run Playwright E2E
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        # NOTE: explicitly NOT suffixing `|| true` — failures here MUST fail the build.
        run: npx playwright test --reporter=line

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
